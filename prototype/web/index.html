<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2eb">
  <title>Bathroom sensor · Connection test</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202824; background: #f4f2eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    main { width: min(100%, 480px); }
    .eyebrow { color: #607268; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: clamp(34px, 9vw, 52px); line-height: 1.05; letter-spacing: -.045em; margin: 14px 0 34px; }
    .panel { background: #fffefa; border: 1px solid #d8ded5; border-radius: 20px; padding: 26px; box-shadow: 0 12px 35px #22372c0d; }
    .label { font-size: 12px; font-weight: 700; color: #607268; letter-spacing: .1em; text-transform: uppercase; }
    .state { display: flex; align-items: center; gap: 12px; margin: 18px 0 10px; font-size: clamp(25px, 7vw, 34px); font-weight: 700; letter-spacing: -.035em; }
    .dot { width: 14px; height: 14px; flex: none; border-radius: 50%; background: #b4bbb3; }
    .online .dot { background: #3c9c70; box-shadow: 0 0 0 5px #3c9c7022; }
    .detail { min-height: 48px; margin: 0; color: #5b665e; line-height: 1.5; }
    .meta { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e7e9e2; color: #65726a; font-size: 14px; }
    .note { margin: 22px 3px 0; color: #65726a; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Prototype · Connection test</div>
    <h1>Bathroom sensor</h1>
    <section class="panel" aria-live="polite">
      <div class="label">ESP32 link</div>
      <div class="state" id="state"><span class="dot"></span><span id="state-text">Checking…</span></div>
      <p class="detail" id="detail">Looking for the latest sensor update.</p>
      <div class="meta" id="updated">No update yet</div>
    </section>
    <p class="note">This page tests the sensor-to-internet connection. Bathroom availability will appear after the lock positions are calibrated.</p>
  </main>
  <script>
    const state = document.getElementById("state");
    const stateText = document.getElementById("state-text");
    const detail = document.getElementById("detail");
    const updated = document.getElementById("updated");

    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error("Status service unavailable");
        const data = await response.json();
        state.classList.toggle("online", data.online);
        stateText.textContent = data.online ? "Sensor connected" : "Waiting for sensor";
        detail.textContent = data.online
          ? (data.sensorOk ? `Latest distance: ${data.distanceMm} mm` : "Connected, but the distance sensor has no valid reading.")
          : "No recent update. The ESP32 may be off or disconnected.";
        updated.textContent = data.reportedAt
          ? `Last update: ${new Date(data.reportedAt).toLocaleString()}`
          : "No update yet";
      } catch {
        state.classList.remove("online");
        stateText.textContent = "Status unavailable";
        detail.textContent = "The page could not reach its status service.";
      }
    }

    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, 15000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refresh();
    });
  </script>
</body>
</html>
